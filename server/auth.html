<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    font-size: 14px;
    line-height: 1.5;
    color: #24292e;
    background-color: #fff;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  html,
  body {
    height: 100vh;
    width: 100vw;
    margin: 0px;
    padding: 0px;
  }

  .content {
    padding: 2em;
    min-width: 40vw;
    max-width: 600px;
  }

  .code {
    padding: 4px;
    background: lightgrey;
    border-radius: 4px;

    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;

    margin-top: 0.5em;
    cursor: pointer;
  }

  .google-sans-code-500 {
    font-family: "Google Sans Code", monospace;
    font-optical-sizing: auto;
    font-weight: <weight>;
    font-style: normal;
    font-variation-settings:
      "MONO" 1;
  }

  #copied {
    display: none;
  }
</style>

<body>
  <div class="content">
    <h2>
      Authenticated!
    </h2>
    <div>
      Run the following to connect:
      <div id="code" class="code google-sans-code-500">
        %s
      </div>

      <div id="copied" class="code google-sans-code-500">
        copied!
      </div>
    </div>
  </div>

  <script>
    document.getElementById("code").addEventListener("click", (event) => {
      navigator.clipboard.writeText(document.getElementById("code").innerText);
      document.getElementById("code").style.display = "none";
      document.getElementById("copied").style.display = "block";

      setTimeout(() => {
        document.getElementById("code").style.display = "block";
        document.getElementById("copied").style.display = "none";
      }, 2000)
    });
  </script>

</body>
