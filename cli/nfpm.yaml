name: "gated-community"
arch: "amd64"
platform: "linux"
version: "0.0.1"
section: "default"
priority: "extra"
replaces:
provides:
  - gated-community
depends:
recommends:
suggests:
conflicts:
maintainer: "Fox Ellison-Taylor <fox.ellisontaylor@gmail.com>"
description: |
  A CLI for flashing FPGAs remotely.
vendor: "FoxMoss"
homepage: "https://foxmoss.com"
license: "MIT"
contents:
  - src: ./gated-community
    dst: /usr/bin/gated-community
  - src: /usr/bin/gated-community
    dst: /sbin/gated-community
    type: symlink
